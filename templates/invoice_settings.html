{% extends "base.html" %}
{% block title %}Fakturainnstillinger · Zaptec-faktura{% endblock %}
{% block content %}
<div class="page" style="max-width: none">
    <div class="container container-sm stack">
        <p style="margin: 0"><a href="/">‹ Tilbake til oversikten</a></p>
        <h1>Fakturainnstillinger ({{ company_name }})</h1>

        {% if message %}
        <div class="alert alert-ok"><span class="dot"></span>{{ message }}</div>
        {% endif %}
        {% if error %}
        <div class="alert alert-err"><span class="dot"></span>{{ error }}</div>
        {% endif %}

        <form class="card" method="post" action="/fiken/innstillinger">
            <div class="card-body stack">
                <div class="field">
                    <label for="income_account">Inntektskonto</label>
                    <select class="input" id="income_account" name="income_account" required>
                        {% set found = namespace(value=false) %}
                        {% for a in accounts %}
                        {% set code = a.code | string %}
                        {% if code == current.income_account %}{% set found.value = true %}{% endif %}
                        <option value="{{ code }}" {% if code == current.income_account %}selected{% endif %}>{{ code }} {{ a.name }}</option>
                        {% endfor %}
                        {% if not found.value %}
                        <option value="" selected disabled>Velg konto</option>
                        {% endif %}
                    </select>
                </div>
                <div class="field">
                    <label for="vat_type">Mva</label>
                    <select class="input" id="vat_type" name="vat_type" required>
                        {% for value, label in vat_types.items() %}
                        <option value="{{ value }}" {% if value == current.vat_type %}selected{% endif %}>{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="field" style="max-width: 220px">
                    <label for="days_until_due">Forfall</label>
                    <div class="input-suffix">
                        <input class="input" type="number" id="days_until_due" name="days_until_due" min="0" max="365"
                            step="1" value="{{ current.days_until_due }}" required />
                        <span>dager</span>
                    </div>
                </div>
            </div>
            <div class="divider-dashed"></div>
            <div class="card-foot">
                <button class="btn btn-fill" type="submit">Lagre</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
