<!doctype html>
<html lang="no">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>{% block title %}Zaptec-faktura{% endblock %}</title>
        <link rel="icon" href="/static/favicon.svg" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="/static/app.css" />
        {% block head %}{% endblock %}
    </head>
    <body>
        <header class="topbar">
            <div class="inner">
                <a class="wordmark" href="/">zaptecfaktura</a>
                {% if user %}
                <div class="menu" data-menu>
                    <button class="btn btn-ghost btn-sm" type="button" aria-haspopup="menu"
                        aria-expanded="false" data-menu-trigger>Meny <span aria-hidden="true">▾</span></button>
                    <div class="menu-panel" role="menu" hidden data-menu-panel>
                        {% if fiken_configured() %}
                        <a class="menu-item" role="menuitem" href="/fiken"><span
                                class="menu-item-text">Tilkobling</span><span class="menu-arrow">›</span></a>
                        {% if fiken_company_selected(user) %}
                        <a class="menu-item" role="menuitem" href="/fiken/innstillinger"><span
                                class="menu-item-text">Fakturainnstillinger</span><span class="menu-arrow">›</span></a>
                        {% endif %}
                        <div class="menu-sep" role="separator"></div>
                        {% endif %}
                        <form method="post" action="/logout">
                            <button class="menu-item" role="menuitem" type="submit"><span
                                    class="menu-item-text">Logg ut</span></button>
                        </form>
                    </div>
                </div>
                {% endif %}
            </div>
        </header>
        {% block content %}{% endblock %}
        <script>
            // Menus in the top bar: toggle on click, close on outside click or Esc.
            document.querySelectorAll('[data-menu]').forEach((menu) => {
                const trigger = menu.querySelector('[data-menu-trigger]');
                const panel = menu.querySelector('[data-menu-panel]');
                const setOpen = (open) => {
                    panel.hidden = !open;
                    trigger.setAttribute('aria-expanded', String(open));
                };
                trigger.addEventListener('click', () => setOpen(panel.hidden));
                document.addEventListener('pointerdown', (e) => {
                    if (!panel.hidden && !menu.contains(e.target)) setOpen(false);
                });
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape' && !panel.hidden) {
                        setOpen(false);
                        trigger.focus();
                    }
                });
            });
        </script>
    </body>
</html>
