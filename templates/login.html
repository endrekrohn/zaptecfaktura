{% extends "base.html" %}
{% block title %}Logg inn · Zaptec-faktura{% endblock %}
{% block content %}
<div class="page" style="max-width: 420px">
    <div class="stack">
        <h1>Logg inn</h1>
        <p class="muted" style="margin: 0">Bruk e-post og passord fra Zaptec-kontoen din.</p>
        {% if error %}
        <div class="alert alert-err"><span class="dot"></span>{{ error }}</div>
        {% endif %}
        <form class="stack" method="post" action="/login">
            <div class="field">
                <label for="username">E-post</label>
                <input id="username" class="input" type="email" name="username" value="{{ username or '' }}"
                    autocomplete="username" required autofocus />
            </div>
            <div class="field">
                <label for="password">Passord</label>
                <input id="password" class="input" type="password" name="password" autocomplete="current-password"
                    required />
            </div>
            <button class="btn btn-fill" type="submit">Logg inn</button>
        </form>
    </div>
</div>
{% endblock %}
