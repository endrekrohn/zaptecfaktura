services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Sessions, customer mapping and draft status survive redeploys.
      - zaptecfaktura-data:/data
    restart: unless-stopped

volumes:
  zaptecfaktura-data:
